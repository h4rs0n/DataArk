name: dataArk

services:
  dataarkapi:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "${DATAARK_PORT}:7845"
    volumes:
      - ./archive:/archive
      - ./meili_dumps:/meili_dumps
      - ./logs:/logs
    depends_on:
      database:
          condition: service_healthy
    command: [
      "-log-dir", "/logs",
      "-log-retention-days", "${LOG_RETENTION_DAYS:-7}",
      "-loc", "${ARCHIVE_LOCATION}",
      "-mhost", "${MEILI_HOST}",
      "-mkey", "${MEILI_MASTER_KEY}",
      "-mdump", "${MEILI_DUMP_DIR}",
      "-sfhost", "${SINGLEFILE_HOST}",
      "-dbhost", "${DB_HOST}",
      "-dbport", "${DB_PORT}",
      "-dbname", "${DB_NAME}",
      "-dbuser", "${DB_USER}",
      "-dbpasswd", "${DB_PASSWORD}",
      "-discover-interval", "${DISCOVERY_INTERVAL}",
      "-discover-timeout", "${DISCOVERY_TIMEOUT}",
      "-discover-max", "${DISCOVERY_MAX_CANDIDATES}",
      "-discover-socks5-proxy", "${DISCOVERY_SOCKS5_PROXY}",
      "-discover-ua", "${DISCOVERY_USER_AGENT}",
      "-recommend-enabled=${RECOMMEND_ENABLED}",
      "-llm-base-url", "${LLM_BASE_URL}",
      "-llm-api-key", "${LLM_API_KEY}",
      "-llm-chat-model", "${LLM_CHAT_MODEL}",
      "-llm-embedding-model", "${LLM_EMBEDDING_MODEL}",
      "-llm-timeout", "${LLM_TIMEOUT}",
      "-embedding-dimension", "${EMBEDDING_DIMENSION}"
    ]

  meili:
    image: getmeili/meilisearch:v1.42
    environment:
      MEILI_MASTER_KEY: "${MEILI_MASTER_KEY}"
      MEILI_DUMP_DIR: "${MEILI_DUMP_DIR}"
    volumes:
      - ./meili_data:/meili_data
      - ./meili_dumps:/meili_dumps

  database:
    image: pgvector/pgvector:pg17
    volumes:
      - ./database:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: "${DB_USER}"
      POSTGRES_PASSWORD: "${DB_PASSWORD}"
      POSTGRES_DB: "${DB_NAME}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  singlefile-webservice:
    image: ghcr.io/h4rs0n/singlefile-webservice:latest
    container_name: singlefile-webservice
    ports:
      - "${SINGLEFILE_PORT}:${SINGLEFILE_PORT}"
    volumes:
      - ./archive:/usr/src/app/output
    restart: unless-stopped
    environment:
      - PORT=${SINGLEFILE_PORT}
      - TIMEOUT=${SINGLEFILE_TIMEOUT}
      - OUTPUT_DIR=${SINGLEFILE_OUTPUT_DIR}
